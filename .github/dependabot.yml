version: 2

updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/microapps-cdk'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Node type majors move with .nvmrc and the runtime, not independently.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Compiler, lint config, and formatting migrations need manual coordination
      # with jsii/Jest and projen's generated standalone package configuration.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '*eslint*'
        update-types: ['version-update:semver-major']
      - dependency-name: '*prettier*'
        update-types: ['version-update:semver-major']
    groups:
      # First matching group wins. Keep coupled tools together across both
      # directories; group-by: dependency-name would split them back into PRs.
      lint-and-typescript:
        applies-to: version-updates
        patterns:
          - '*eslint*'
          - '*prettier*'
          - 'typescript'
          - 'ts-node'
          - 'lint-staged'
          - 'husky'
      testing:
        applies-to: version-updates
        patterns:
          - '*jest*'
          - 'sinon'
          - '@types/sinon'
          - 'aws-sdk-client-mock'
          - 'mock-fs'
          - '@types/mock-fs'
      aws-sdk:
        applies-to: version-updates
        patterns:
          - 'aws-sdk'
          - '@aws-sdk/*'
          - '@smithy/*'
      cdk-and-jsii:
        applies-to: version-updates
        patterns:
          - 'aws-cdk'
          - 'aws-cdk-lib'
          - '@aws-cdk/*'
          - 'constructs'
          - 'projen'
          - 'jsii'
          - 'jsii-*'
          - '@jsii/*'
      other-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      # Security updates are evaluated separately from version-update groups.
      esbuild-security:
        applies-to: security-updates
        patterns:
          - 'esbuild'
