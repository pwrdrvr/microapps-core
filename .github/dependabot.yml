version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/microapps-cdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      workspace-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: "dependency-name"
      # group-by applies only to version updates. Group esbuild security fixes
      # across both directories separately, without bundling unrelated updates.
      esbuild-security:
        applies-to: security-updates
        patterns:
          - "esbuild"
